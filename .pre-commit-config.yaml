repos:
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: 192ad822316c3a22fb3d3cc8aa6eafa0b8488360 # v0.45.0
    hooks:
      - id: markdownlint
        language_version: 24.22.3
  - repo: local
    hooks:
      - id: community-files
        name: Check community files
        entry: python scripts/check_community.py
        language: system
        pass_filenames: false
        always_run: true
      - id: community-check-tests
        name: Test community validation
        entry: python -m unittest discover -s tests
        language: system
        pass_filenames: false
        always_run: true
      - id: reuse
        name: Check REUSE licensing
        entry: reuse lint
        language: system
        pass_filenames: false
        always_run: true
