name: Bug report
description: Report a reproducible problem without sensitive security details.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow https://github.com/OpenTLV/.github/blob/main/SECURITY.md.
        Remove secrets and personal information from examples and logs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which revision is affected?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and relevant tool versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include a minimal sanitized example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened instead.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste sanitized error output only; omit credentials and unrelated personal information.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues, affected components, or other details that help reproduce the problem.
