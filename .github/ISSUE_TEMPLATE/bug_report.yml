name: Bug
description: Report a reproducible problem in this repository.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Search this repository's existing issues first and check the [component directory](https://github.com/OpenTLV/.github/blob/main/SUPPORT.md).
        Do not report suspected vulnerabilities here; use the [private security route](https://github.com/OpenTLV/.github/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem and the affected component.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Package version, tag or full commit; include the Core version if relevant.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Relevant operating system, architecture, compiler/runtime and build options.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide a minimal example and the commands needed to reproduce it. Remove secrets and personal data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Include sanitized output only; omit credentials and unrelated personal information.
      render: text
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Related issues or other information that helps reproduce the problem.
