name: Epic
description: Coordinate larger work through native GitHub sub-issues.
type: Epic
body:
  - type: markdown
    attributes:
      value: |
        Use this form for larger coordinated work that will be split into child issues.
        After submission, someone with Triage access or higher can create or attach sub-issues to track progress.
        For vulnerabilities, follow https://github.com/OpenTLV/.github/blob/main/SECURITY.md.
        Remove secrets and personal information before submitting.
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What problem does the epic address, and why is coordinated work needed?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
      description: Define the work included and what is explicitly outside this epic.
    validations:
      required: true
  - type: textarea
    id: outcomes
    attributes:
      label: Expected outcomes
      description: Describe the results for users, contributors, or maintainers.
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Child-issue plan
      description: Outline the work and its sequence in plain text. Include links to existing child issues when available.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies and risks
      description: Note external dependencies, blockers, and coordination between components or repositories.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define epic-level completion criteria and evidence beyond individual child tasks.
    validations:
      required: true
