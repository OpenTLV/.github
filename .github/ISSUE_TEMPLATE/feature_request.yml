name: Feature request
description: Explain a problem and propose an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, follow https://github.com/OpenTLV/.github/blob/main/SECURITY.md.
        Remove secrets and personal information from examples and logs.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Who would benefit and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior and scope.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and tradeoffs
      description: Include workarounds and compatibility concerns if known.
