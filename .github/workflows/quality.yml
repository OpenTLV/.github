name: Community quality

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Verify development lockfile reproducibility
        shell: bash
        run: |
          python -m venv .cache/lock-generator
          source .cache/lock-generator/bin/activate
          python -m pip install --require-hashes --only-binary=:all: -r requirements-lock.txt
          uv --no-config pip compile --python-version "$(cat .python-version)" --python-platform x86_64-manylinux_2_39 --generate-hashes --only-binary=:all: --no-binary=reuse --output-file requirements-dev.txt requirements-dev.in
          git diff --exit-code -- requirements-dev.txt
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt
          python -m pip install --require-hashes --no-build-isolation --only-binary=:all: --no-binary=reuse -r requirements-dev.txt
          python -m pip check
      - run: pre-commit run --all-files

  workflow-analyzers:
    name: workflow-analyzers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Check GitHub Actions correctness
        shell: bash
        run: |
          mkdir -p .cache/actionlint
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output .cache/actionlint/actionlint.tar.gz
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  .cache/actionlint/actionlint.tar.gz' | sha256sum --check --strict
          tar -xzf .cache/actionlint/actionlint.tar.gz -C .cache/actionlint actionlint
          .cache/actionlint/actionlint -shellcheck= -pyflakes=
      - name: Install GitHub Actions security analyzer
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-actions.txt
      - name: Check GitHub Actions security offline
        if: github.ref != 'refs/heads/main' || (github.event_name != 'push' && github.event_name != 'schedule')
        run: zizmor --offline --strict-collection --collect=workflows .
      - name: Check GitHub Actions security online
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : "${GH_TOKEN:?GitHub token is required for online audits}"
          zizmor --strict-collection --collect=workflows .
